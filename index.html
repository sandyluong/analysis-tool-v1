<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Analysis — GL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f4ef;
  --panel:#ffffff;
  --ink:#1b1e23;
  --ink-soft:#5b6169;
  --ink-faint:#8b909a;
  --line:#e2e0d6;
  --line-strong:#c9c6b8;
  --accent:#0e6b5c;
  --accent-soft:#dceee9;
  --accent-ink:#083f36;
  --neg:#a83b32;
  --neg-soft:#f5e2df;
  --amber:#95692a;
  --amber-soft:#f2e7d3;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);color:var(--accent-ink);}
a{color:var(--accent-ink);}

/* ---------- shell ---------- */
.shell{max-width:1320px;margin:0 auto;padding:0 20px 64px;}

header.top{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:20px 0 14px;border-bottom:1px solid var(--line-strong);
  margin-bottom:0;gap:20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;}
.brand h1 .dim{font-weight:400;color:var(--ink-soft);}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:11.5px;}

.nav-cluster{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pill-btn{
  font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);
  background:var(--panel);border:1px solid var(--line-strong);border-radius:20px;
  padding:8px 14px;cursor:pointer;white-space:nowrap;
}
.pill-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.pill-btn .care{font-size:10px;color:var(--ink-faint);}

nav.tabs{
  display:flex;gap:2px;background:var(--bg);border:1px solid var(--line-strong);
  border-radius:20px;padding:3px;
}
nav.tabs button{
  font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);
  background:none;border:none;padding:7px 14px;cursor:pointer;border-radius:16px;
  transition:background .12s,color .12s;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button.active{color:#fff;background:var(--accent);}
.header-actions{display:flex;gap:8px;}

.last-loaded{
  font-size:11.5px;color:var(--ink-soft);padding:9px 0;border-bottom:1px solid var(--line);
  margin-bottom:18px;min-height:1px;
}
.last-loaded:empty{border-bottom:none;padding:0;margin-bottom:12px;}

.pnl-wrap{position:relative;}
.pnl-menu{
  position:absolute;top:100%;left:0;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(20,20,10,.12);z-index:40;min-width:190px;
  display:none;padding:4px;margin-top:6px;
}
.pnl-menu.open{display:block;}
.pnl-menu button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:12.5px;
  border-radius:2px;color:var(--ink);border-bottom:none;margin-bottom:0;background:none;border:none;cursor:pointer;}
.pnl-menu button:hover{background:var(--bg);}
.pnl-menu button.active{color:var(--accent-ink);font-weight:600;background:var(--accent-soft);}

.view{display:none;}
.view.active{display:block;}

/* ---------- panels / cards ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;
}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);
  margin:0 0 12px;font-weight:600;}
.panel h2 .muted{text-transform:none;letter-spacing:0;color:var(--ink-faint);font-weight:400;}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.col{flex:1 1 320px;min-width:0;}

/* ---------- dropzone ---------- */
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);
  padding:40px 20px;text-align:center;cursor:pointer;
  background:repeating-linear-gradient(135deg,rgba(0,0,0,0.012) 0 10px,transparent 10px 20px);
  transition:border-color .15s,background .15s;
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.dropzone .big{font-size:14px;font-weight:600;margin-bottom:4px;}
.dropzone .small{color:var(--ink-soft);font-size:11.5px;}
.dropzone input{display:none;}

/* ---------- forms ---------- */
label.field{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;
  text-transform:uppercase;letter-spacing:.04em;}
select,input[type=text],input[type=number],input[type=date]{
  font-family:var(--sans);font-size:12.5px;padding:7px 8px;border:1px solid var(--line-strong);
  border-radius:var(--radius);background:var(--panel);color:var(--ink);width:100%;
}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.field-group{margin-bottom:12px;}
.hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.btn{
  font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;
  border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent);
  color:#fff;cursor:pointer;transition:background .12s,transform .05s;
}
.btn:hover{background:var(--accent-ink);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--panel);color:var(--accent-ink);border-color:var(--line-strong);}
.btn.secondary:hover{border-color:var(--accent);background:var(--accent-soft);}
.btn.danger{background:var(--panel);color:var(--neg);border-color:var(--neg-soft);}
.btn.danger:hover{background:var(--neg-soft);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ---------- tables ---------- */
table.data{width:100%;border-collapse:collapse;font-size:12px;}
table.data th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line-strong);
  position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none;white-space:nowrap;
}
table.data th.num,table.data td.num{text-align:right;font-family:var(--mono);}
table.data td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
table.data tbody tr:hover{background:var(--bg);}
table.data tbody tr.total-row td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;background:var(--bg);}
table.data tbody tr.sub-row td{color:var(--ink-soft);}
.table-scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);}
.table-scroll table.data th{top:0;}
.preview-table{white-space:nowrap;}
.preview-table td, .preview-table th{white-space:nowrap;}
.preview-table thead th{position:sticky;top:0;z-index:2;}
.preview-table tbody tr.header-row td{background:var(--accent-soft);font-weight:600;}

.pos{color:var(--accent-ink);}
.neg{color:var(--neg);}
.chip{
  display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line-strong);color:var(--ink-soft);
}
.chip.rev{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);}
.chip.cogs{background:#e2e6f2;color:#39508a;border-color:#39508a;}
.chip.asset{background:#eef1f5;color:#5b6980;border-color:#c7cfd9;}
.chip.liability{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
.chip.expense{background:var(--bg);color:var(--ink-soft);border-color:var(--line-strong);}
.chip.accrued{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
.chip.deferred{background:#e2e6f2;color:#39508a;border-color:#39508a;}

/* accounts list */
.acct-list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;}
.acct-row{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);
  font-size:12px;cursor:pointer;
}
.acct-row:hover{background:var(--bg);}
.acct-row input{margin:0;flex:none;}
.acct-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-row .amt{font-family:var(--mono);flex:none;width:110px;text-align:right;}
.acct-row.excluded{opacity:.45;}
.acct-list-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.collapse-toggle{font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.collapse-toggle .caret{display:inline-block;transition:transform .12s;color:var(--ink-soft);}
.collapse-toggle .caret.closed{transform:rotate(-90deg);}
.acct-summary{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap;}
.acct-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
.acct-controls input[type=text]{flex:1 1 180px;min-width:140px;}
.toggle-chip{
  font-family:var(--sans);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:16px;
  border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.toggle-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.btn.sm{padding:6px 11px;font-size:11.5px;}

.filters-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.filters-row .field-group{flex:1 1 150px;min-width:130px;margin-bottom:0;}

/* bars for breakdown */
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;}
.bar-row .label{flex:0 0 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:14px;background:var(--bg);border-radius:2px;overflow:hidden;position:relative;}
.bar-fill{height:100%;background:var(--accent);border-radius:2px;}
.bar-fill.neg{background:var(--neg);}
.bar-row .val{flex:0 0 100px;text-align:right;font-family:var(--mono);}

.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;flex:1 1 160px;}
.kpi.highlight{border-color:var(--accent);border-left:3px solid var(--accent);}
.kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:4px;}
.kpi .value{font-family:var(--mono);font-size:20px;font-weight:600;}
.kpi .value.neg{color:var(--neg);}
.kpi .value.pos{color:var(--accent-ink);}
.kpi .sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.kpi .sub a{color:var(--accent-ink);font-weight:600;text-decoration:none;}
.kpi .sub a:hover{text-decoration:underline;}

.empty-state{
  text-align:center;padding:48px 20px;color:var(--ink-soft);
}
.empty-state .glyph{font-size:28px;margin-bottom:8px;opacity:.5;}
.empty-state h3{margin:0 0 6px;color:var(--ink);font-size:14px;}
.empty-state p{margin:0 0 16px;font-size:12.5px;}

.month-flip{display:flex;align-items:center;gap:10px;}
.month-flip button.arrow{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);background:var(--panel);
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;
}
.month-flip button.arrow:hover{border-color:var(--accent);color:var(--accent-ink);}
.month-flip .cur{font-family:var(--mono);font-weight:600;font-size:13px;min-width:90px;text-align:center;}
.lock-btn{background:none;border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);}
.lock-btn.locked{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}

.pnl-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);
  font-size:12.5px;cursor:pointer;}
.pnl-line:hover{background:var(--bg);}
.pnl-line .l{color:var(--ink);}
.pnl-line .v{font-family:var(--mono);}
.pnl-line.section{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none;margin-top:6px;padding-top:8px;}
.pnl-line.grand{font-weight:700;background:var(--accent-soft);border-radius:var(--radius);padding:8px 10px;
  border:1px solid var(--accent);margin-top:10px;}
.pnl-line.indent{padding-left:14px;color:var(--ink-soft);}

/* drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,20,10,.35);display:none;z-index:80;}
.drawer-overlay.open{display:block;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(680px,92vw);background:var(--panel);
  box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:81;
  transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--line-strong);}
.drawer-head h3{margin:0;font-size:14px;}
.drawer-head button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.drawer-body{padding:14px 18px;overflow:auto;flex:1;}

.badge-toggle{display:flex;gap:6px;flex-wrap:wrap;}
.badge-toggle button{
  font-size:11.5px;padding:5px 10px;border-radius:14px;border:1px solid var(--line-strong);
  background:var(--panel);cursor:pointer;color:var(--ink-soft);
}
.badge-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.footnote{font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.5;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:820px){.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div>
        <h1>Revenue Analysis <span class="dim">— GL detail</span></h1>
        <p>Reads NetSuite-style GL exports in your browser. Nothing is uploaded anywhere.</p>
      </div>
    </div>
    <div class="nav-cluster">
      <div class="pnl-wrap">
        <button id="pnlTabBtn" class="pill-btn" data-view="pnl">P&amp;L <span class="care">▾</span></button>
        <div class="pnl-menu" id="pnlMenu">
          <button data-pnl="standard" class="active">Standard P&amp;L</button>
          <button data-pnl="vbs">VBS / Classic</button>
          <button data-pnl="cogs">COGS</button>
          <button data-pnl="staff">Staff Costs</button>
          <button data-pnl="nonstaff">Non Staff Costs</button>
        </div>
      </div>
      <nav class="tabs" id="tabNav">
        <button data-view="current" class="active">Current Month</button>
        <button data-view="mom">Month over Month</button>
        <button data-view="revtypes">Revenue Types</button>
      </nav>
      <div class="header-actions">
        <button class="btn secondary" id="headerClearSaved">Clear saved</button>
        <button class="btn secondary" id="headerLoadNew">Load a different file</button>
      </div>
    </div>
  </header>
  <div id="lastLoadedBar" class="last-loaded"></div>

  <!-- ============ CURRENT MONTH VIEW ============ -->
  <section class="view active" id="view-current"></section>

  <!-- ============ MONTH OVER MONTH VIEW ============ -->
  <section class="view" id="view-mom"></section>

  <!-- ============ REVENUE TYPES VIEW ============ -->
  <section class="view" id="view-revtypes"></section>

  <!-- ============ P&L VIEW ============ -->
  <section class="view" id="view-pnl"></section>

</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">Detail</h3>
    <div class="btn-row">
      <button class="btn secondary" id="drawerExport">⬇ Export CSV</button>
      <button id="drawerClose">✕</button>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
/* ====================================================================
   Revenue Analysis — GL
   Single-file client-side GL revenue analyzer. All parsing, storage,
   and computation happens in the browser — no network calls with data.
   ==================================================================== */

/* ---------------------------------------------------------------
   1. GLOBAL STATE
   --------------------------------------------------------------- */
const STORAGE_KEY = 'glRevenueHistory.v1';

const state = {
  workbook: null,          // parsed SheetJS workbook
  sheetName: null,
  rawGrid: [],             // array of arrays for chosen sheet
  headerRowIdx: 0,         // 0-based index into rawGrid
  colMap: {                // column name -> index (into header row)
    account: null, debit: null, credit: null, date: null
  },
  headerNames: [],         // header row values
  entries: [],             // parsed GL line objects for loaded file(s)
  monthLabel: null,        // e.g. "Jun 2026" derived from data
  accountMeta: {},         // acct -> {num, name, type, included}
  breakdownDim: 'department',
  filterValue: 'all',
  dateFrom: null,
  dateTo: null,
  searchTerm: '',
  rowSearch: '',
  acctListCollapsed: false,
  showAllAccounts: false,  // raw data: show non-revenue too
  history: loadHistory(),  // persisted month -> aggregate snapshot
  pendingMonths: null,     // months detected while adding to MoM, awaiting confirm
  momCompareA: null,
  momCompareB: null,
  momBreakdownDim: 'department',
  revFocusMonth: null,
  revCompDim: 'productLine',
  pnlSub: 'standard',
  pnlMonths: [],           // ordered list of month labels available to P&L
  pnlMonthIdx: 0,
  pnlLocked: false,
};

const DIM_FIELDS = {
  department:   {label: 'Department',      key: 'department'},
  productLine:  {label: 'Product Line',    key: 'productLine'},
  customer:     {label: 'Customer',        key: 'customer'},
  division:     {label: 'Division',        key: 'division'},
  subsidiary:   {label: 'Subsidiary',      key: 'subsidiary'},
  accountType:  {label: 'Account Type',    key: 'accountType'},
  account:      {label: 'GL Account',      key: 'account'},
};

/* ---------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------- */
function parseNum(v){
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/,/g,'').replace(/\((.*)\)/,'-$1'));
  return isNaN(n) ? 0 : n;
}

function fmtMoney(n, opts={}){
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  const str = abs.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (opts.noSign ? '' : sign) + '$' + str;
}
function fmtMoneyShort(n){
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1e6) return sign + '$' + (abs/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return sign + '$' + (abs/1e3).toFixed(1) + 'k';
  return sign + '$' + abs.toFixed(0);
}
function fmtPct(n){
  if (!isFinite(n)) return '—';
  return (n>=0?'':'') + n.toFixed(1) + '%';
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uniqSorted(arr){ return Array.from(new Set(arr)).sort(); }
function sumBy(list, fn){ return list.reduce((a,x)=>a+fn(x),0); }

function groupSum(entries, keyFn, valFn){
  const map = new Map();
  for (const e of entries){
    const k = keyFn(e) || '(blank)';
    map.set(k, (map.get(k)||0) + valFn(e));
  }
  return map;
}

function downloadFile(filename, content, mime='text/csv'){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function rowsToCSV(headers, rows){
  const esc = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))].join('\n');
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveHistory(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history)); }catch(e){
    alert('Could not save to browser storage: ' + e.message);
  }
}

function monthSortKey(label){
  // "Jun 2026" -> 202606 ; falls back to string compare if unparseable
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = /^([A-Za-z]{3})[a-z]*\s+(\d{4})$/.exec(label||'');
  if (m){
    const mi = months.indexOf(m[1].slice(0,3));
    if (mi>=0) return parseInt(m[2],10)*100 + (mi+1);
  }
  return label;
}
function sortedMonthLabels(labels){
  return [...labels].sort((a,b)=>{
    const ka=monthSortKey(a), kb=monthSortKey(b);
    if (typeof ka==='number' && typeof kb==='number') return ka-kb;
    return String(ka).localeCompare(String(kb));
  });
}

/* ---------------------------------------------------------------
   3. ACCOUNT / DIMENSION CLASSIFICATION
   --------------------------------------------------------------- */
function acctNum(acctStr){
  const m = /^(\d+)/.exec(String(acctStr||'').trim());
  return m ? m[1] : '';
}
function acctName(acctStr){
  const s = String(acctStr||'');
  const i = s.indexOf(' - ');
  return i>=0 ? s.slice(i+3).trim() : s.trim();
}
function acctPrefixBucket(acctStr){
  const n = acctNum(acctStr);
  if (!n) return 'other';
  const d = n[0];
  if (d==='1') return 'accrued';   // Accrued / Asset context
  if (d==='2') return 'deferred';  // Deferred / Liability context
  if (d==='4') return 'revenue';
  if (d==='5') return 'cogs';
  return 'opex';                  // 6/7/8/9 staff or non-staff, decided below
}
const STAFF_RE = /payroll|salar|wage|bonus|commission|401k|401\(k\)|benefit|medical|dental|health\s*insur|employer.*match|payroll tax/i;
function isStaffCost(name){ return STAFF_RE.test(name||''); }

function classifyBucket(e){
  // Returns one of: revenue, cogs, staff, nonstaff, accrued, deferred, other
  // Account number prefix is the primary signal (matches the source tool's own rule:
  // "Revenue accounts (numbers starting with 4)... Accrued (1xxxxx) and Deferred (2xxxxx)").
  // Account Type is used to catch cross-cutting cases (e.g. a COGS-type account outside 5xxxxx).
  const pfx = acctPrefixBucket(e.account);
  if (pfx==='accrued') return 'accrued';
  if (pfx==='deferred') return 'deferred';
  if (pfx==='revenue' || e.accountType==='Income' || e.accountType==='Other Income') return 'revenue';
  if (pfx==='cogs' || e.accountType==='Cost of Goods Sold') return 'cogs';
  // Everything else with an expense-like account number (3/6/7/8/9-prefixed, or unresolved
  // Account Type) is treated as opex rather than dropped into "other" — NetSuite exports
  // routinely leave Account Type blank on allocation/journal-entry lines.
  return isStaffCost(e.accountName) ? 'staff' : 'nonstaff';
}

const RECURRING_PL = new Set(['SaaS','SaaS - AI','Subscription','Valpay']);
const NONRECURRING_PL = new Set(['Professional Services','Hardware','Software License','Partnership','Other']);
function classifyRevenueType(e){
  const n = (e.accountName||'').toLowerCase();
  if (/non[\s-]?recurring/.test(n)) return 'Non-Recurring';
  if (/recurring/.test(n)) return 'Recurring';
  const pl = e.productLine || '';
  if (RECURRING_PL.has(pl)) return 'Recurring';
  if (NONRECURRING_PL.has(pl)) return 'Non-Recurring';
  return 'Unclassified';
}

/* ---------------------------------------------------------------
   4. FILE PARSING (SheetJS) + COLUMN AUTO-DETECTION
   --------------------------------------------------------------- */
const HEADER_HINTS = {
  account: /^(name|account)/i,
  debit:   /^debit/i,
  credit:  /^credit/i,
  date:    /^date/i,
};
// secondary dimension columns we try to auto-map for breakdowns
const DIM_HINTS = {
  department:  /^department$/i,
  productLine: /product\s*line/i,
  customer:    /customer/i,
  division:    /^division$/i,
  subsidiary:  /^subsidiary(\s*name)?$/i,
  accountType: /account\s*type/i,
  period:      /accounting period/i,
  memo:        /^memo$/i,
  docNumber:   /document\s*number/i,
  vendor:      /vendor/i,
};

function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

async function parseWorkbookFromFile(file){
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
  return wb;
}

function sheetToGrid(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}

// Score each of the first N rows to find the most likely header row.
function detectHeaderRow(grid){
  const N = Math.min(20, grid.length);
  let best = 0, bestScore = -1;
  for (let r=0; r<N; r++){
    const row = grid[r] || [];
    const nonEmpty = row.filter(c => c !== null && c !== '').length;
    if (nonEmpty < 4) continue;
    let score = nonEmpty;
    for (const cell of row){
      const s = String(cell||'');
      if (HEADER_HINTS.account.test(s)) score += 5;
      if (HEADER_HINTS.debit.test(s)) score += 5;
      if (HEADER_HINTS.credit.test(s)) score += 5;
      if (HEADER_HINTS.date.test(s)) score += 3;
    }
    if (score > bestScore){ bestScore = score; best = r; }
  }
  return best;
}

function detectColumns(headerRow){
  const map = {account:null, debit:null, credit:null, date:null};
  const dims = {};
  headerRow.forEach((cell, i)=>{
    const s = String(cell||'').trim();
    if (!s) return;
    if (map.account===null && HEADER_HINTS.account.test(s)) map.account = i;
    if (map.debit===null && HEADER_HINTS.debit.test(s)) map.debit = i;
    if (map.credit===null && HEADER_HINTS.credit.test(s)) map.credit = i;
    if (map.date===null && HEADER_HINTS.date.test(s)) map.date = i;
    for (const [k,re] of Object.entries(DIM_HINTS)){
      if (dims[k]===undefined && re.test(s)) dims[k] = i;
    }
  });
  // Fallback: account column heuristic -- look for "NNNNN - Text" pattern in data
  return {map, dims};
}

function fallbackAccountColumn(grid, headerRowIdx){
  const sample = grid.slice(headerRowIdx+1, headerRowIdx+30);
  let bestCol = -1, bestHits = -1;
  const ncols = Math.max(...grid.slice(headerRowIdx, headerRowIdx+1).map(r=>r.length), 0);
  for (let c=0; c<ncols; c++){
    let hits = 0;
    for (const row of sample){
      const v = row[c];
      if (typeof v === 'string' && /^\d{3,}\s*-\s*\S/.test(v)) hits++;
    }
    if (hits > bestHits){ bestHits = hits; bestCol = c; }
  }
  return bestHits > 0 ? bestCol : -1;
}

function isDateLike(v){
  return v !== null && typeof v === 'object' && typeof v.getTime === 'function' && !isNaN(v.getTime());
}
function excelDateToJS(v){
  if (isDateLike(v)) return v;
  if (typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return new Date(Date.UTC(d.y, d.m-1, d.d));
  }
  if (typeof v === 'string'){
    const d = new Date(v);
    if (!isNaN(d)) return d;
  }
  return null;
}
function monthLabelFromDate(d){
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
// SheetJS's CSV parser infers cell types, so a text period like "Jun 2026" can come back
// as an actual Date object (raw:true then yields a Date rather than the original string).
// Normalize either shape back to a plain "Mon YYYY" label.
function normalizePeriodLabel(v){
  if (v===null || v===undefined || v==='') return null;
  if (isDateLike(v)) return monthLabelFromDate(v);
  return String(v);
}

// Build entry objects from the raw grid using the confirmed column map.
function buildEntries(){
  const grid = state.rawGrid;
  const hIdx = state.headerRowIdx;
  const map = state.colMap;
  const dims = state.dimMap || {};
  const entries = [];
  for (let r=hIdx+1; r<grid.length; r++){
    const row = grid[r];
    if (!row) continue;
    const acctRaw = map.account!=null ? row[map.account] : null;
    if (acctRaw===null || acctRaw===undefined || acctRaw==='') continue;
    const debit = map.debit!=null ? parseNum(row[map.debit]) : 0;
    const credit = map.credit!=null ? parseNum(row[map.credit]) : 0;
    let dateVal = map.date!=null ? excelDateToJS(row[map.date]) : null;
    const num = acctNum(acctRaw);
    const name = acctName(acctRaw);
    const e = {
      account: String(acctRaw),
      num, accountName: name,
      date: dateVal,
      debit, credit,
      net: credit - debit,
      department: dims.department!=null ? (row[dims.department]||'(none)') : null,
      productLine: dims.productLine!=null ? (row[dims.productLine]||'(none)') : null,
      customer: dims.customer!=null ? (row[dims.customer]||'(none)') : null,
      division: dims.division!=null ? (row[dims.division]||'(none)') : null,
      subsidiary: dims.subsidiary!=null ? (row[dims.subsidiary]||'(none)') : null,
      accountType: dims.accountType!=null ? (row[dims.accountType]||'(none)') : null,
      period: dims.period!=null ? normalizePeriodLabel(row[dims.period]) : null,
      memo: dims.memo!=null ? row[dims.memo] : null,
      docNumber: dims.docNumber!=null ? row[dims.docNumber] : null,
      vendor: dims.vendor!=null ? row[dims.vendor] : null,
    };
    entries.push(e);
  }
  return entries;
}

// NetSuite exports frequently leave "Account Type" blank on allocation / journal-entry
// lines even though it's populated on other lines for the same account. Resolve it at
// the account level (most common non-blank value) so classification doesn't miss rows.
function resolveAccountTypes(entries){
  const votes = {};
  for (const e of entries){
    if (!e.accountType || e.accountType==='(none)') continue;
    votes[e.account] = votes[e.account] || {};
    votes[e.account][e.accountType] = (votes[e.account][e.accountType]||0) + 1;
  }
  const resolved = {};
  for (const [acct, counts] of Object.entries(votes)){
    resolved[acct] = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  }
  for (const e of entries){
    if (!e.accountType || e.accountType==='(none)') e.accountType = resolved[e.account] || e.accountType;
  }
  return entries;
}

function deriveMonthLabel(entries){
  const counts = new Map();
  for (const e of entries){
    let label = null;
    if (e.period) label = String(e.period);
    else if (e.date) label = monthLabelFromDate(e.date);
    if (label) counts.set(label, (counts.get(label)||0)+1);
  }
  let best=null, bestN=-1;
  for (const [k,v] of counts) if (v>bestN){bestN=v; best=k;}
  return best;
}

/* ---------------------------------------------------------------
   5. ACCOUNT META + FILTERED VIEWS
   --------------------------------------------------------------- */
function rebuildAccountMeta(){
  const meta = {};
  for (const e of state.entries){
    if (!meta[e.account]){
      const bucket = acctPrefixBucket(e.account);
      meta[e.account] = {
        account: e.account, num: e.num, name: e.accountName,
        bucket, net: 0, accountType: e.accountType || null,
        included: (state.accountMeta[e.account]?.included) ?? (bucket==='revenue'),
      };
    }
    meta[e.account].net += e.net;
  }
  state.accountMeta = meta;
}

// Maps a NetSuite-style Account Type onto the same coarse categories the source
// tool's chips use (Revenue / COGS / Asset / Liability / Expense).
function chipForAccount(meta){
  const at = meta.accountType || '';
  if (/income/i.test(at)) return {label:'Revenue', cls:'rev'};
  if (/cost of goods/i.test(at)) return {label:'COGS', cls:'cogs'};
  if (/expense/i.test(at) && !/deferred expense/i.test(at)) return {label:'Expense', cls:'expense'};
  if (/receivable|^bank$|asset|prepaid|undeposited/i.test(at)) return {label:'Asset', cls:'asset'};
  if (/payable|liability|credit card|deferred revenue/i.test(at)) return {label:'Liability', cls:'liability'};
  // Fallback to the account-number prefix convention when Account Type never resolves
  if (meta.bucket==='revenue') return {label:'Revenue', cls:'rev'};
  if (meta.bucket==='cogs') return {label:'COGS', cls:'cogs'};
  if (meta.bucket==='accrued') return {label:'Asset', cls:'asset'};
  if (meta.bucket==='deferred') return {label:'Liability', cls:'liability'};
  return {label:'Expense', cls:'expense'};
}

function includedEntries(){
  const included = new Set(Object.values(state.accountMeta).filter(a=>a.included).map(a=>a.account));
  const term = (state.rowSearch||'').trim().toLowerCase();
  return state.entries.filter(e=>{
    if (!included.has(e.account)) return false;
    if (state.dateFrom && e.date && e.date < new Date(state.dateFrom)) return false;
    if (state.dateTo && e.date && e.date > new Date(state.dateTo+'T23:59:59')) return false;
    if (state.filterValue !== 'all'){
      const field = DIM_FIELDS[state.breakdownDim].key;
      if (String(e[field]) !== state.filterValue) return false;
    }
    if (term){
      const haystack = [e.account, e.department, e.productLine, e.customer, e.division, e.subsidiary, e.memo, e.docNumber]
        .map(v=>String(v||'').toLowerCase()).join(' ');
      if (!haystack.includes(term)) return false;
    }
    return true;
  });
}

function totalRevenue(){ return sumBy(includedEntries(), e=>e.net); }

/* ---------------------------------------------------------------
   6. HISTORY SNAPSHOTS (Month over Month persistence)
   --------------------------------------------------------------- */
function buildSnapshotForMonth(monthLabel, entriesForMonth){
  const inc = entriesForMonth; // entries already filtered to included revenue accounts, this month
  const snap = {
    label: monthLabel,
    total: sumBy(inc, e=>e.net),
    byAccount: {}, byDepartment: {}, byProductLine: {}, byCustomer: {},
    byDivision: {}, bySubsidiary: {}, byRevenueType: {},
    // whole-GL P&L aggregates (uses ALL entries for the month, not just included revenue)
    pnl: {revenue:0, cogs:0, staff:0, nonstaff:0, byDeptStaff:{}, byDeptNonStaff:{}, byDeptCogs:{}},
    savedAt: new Date().toISOString(),
  };
  const add = (obj,k,v)=>{ k = k||'(none)'; obj[k]=(obj[k]||0)+v; };
  for (const e of inc){
    add(snap.byAccount, e.account, e.net);
    add(snap.byDepartment, e.department, e.net);
    add(snap.byProductLine, e.productLine, e.net);
    add(snap.byCustomer, e.customer, e.net);
    add(snap.byDivision, e.division, e.net);
    add(snap.bySubsidiary, e.subsidiary, e.net);
    add(snap.byRevenueType, classifyRevenueType(e), e.net);
  }
  // Full GL pass (all accounts, this month) for P&L tab
  const monthAll = state.entries.filter(e=>{
    const label = e.period || (e.date?monthLabelFromDate(e.date):null);
    return label === monthLabel;
  });
  for (const e of monthAll){
    const b = classifyBucket(e);
    if (b==='revenue') snap.pnl.revenue += e.net;
    else if (b==='cogs'){ snap.pnl.cogs += e.net; add(snap.pnl.byDeptCogs, e.department, e.net); }
    else if (b==='staff'){ snap.pnl.staff += e.net; add(snap.pnl.byDeptStaff, e.department, e.net); }
    else if (b==='nonstaff'){ snap.pnl.nonstaff += e.net; add(snap.pnl.byDeptNonStaff, e.department, e.net); }
  }
  return snap;
}

function saveMonthsToHistory(monthLabels){
  for (const label of monthLabels){
    const monthEntries = includedEntries().filter(e=>{
      const l = e.period || (e.date?monthLabelFromDate(e.date):null);
      return l === label;
    });
    state.history[label] = buildSnapshotForMonth(label, monthEntries);
  }
  saveHistory();
}

    return b.net - a.net;
  });
  const term = state.searchTerm.toLowerCase();
  box.innerHTML = rows.filter(a => !term || a.name.toLowerCase().includes(term) || a.num.includes(term)).map(a=>{
    const chip = chipForAccount(a);
    return `<label class="acct-row ${a.included?'':'excluded'}" data-acct="${esc(a.account)}">
      <input type="checkbox" data-act="toggle-acct" data-acct="${esc(a.account)}" ${a.included?'checked':''}>
      <span class="name">${esc(a.account)}</span>
      <span class="chip ${chip.cls}">${esc(chip.label)}</span>
      <span class="amt ${a.net<0?'neg':'pos'}">${fmtMoney(a.net)}</span>
    </label>`;
  }).join('') || '<div style="padding:14px;color:var(--ink-faint);">No accounts match.</div>';
}

function renderRevByCategory(){
  const box = document.getElementById('revByCategory');
  if (!box) return;
  const inc = includedEntries();
  const dim = DIM_FIELDS[state.breakdownDim].key;
  const map = groupSum(inc, e=>e[dim], e=>e.net);
  const rows = Array.from(map.entries()).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1, ...rows.map(r=>Math.abs(r[1])));
  if (!rows.length){ box.innerHTML = '<div class="footnote">No data for current filters.</div>'; return; }
  box.innerHTML = rows.map(([k,v])=>`
    <div class="bar-row">
      <div class="label" title="${esc(k)}">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill ${v<0?'neg':''}" style="width:${Math.min(100,Math.abs(v)/max*100)}%"></div></div>
      <div class="val ${v<0?'neg':'pos'}">${fmtMoneyShort(v)}</div>
    </div>`).join('');
}

function renderRevByAccount(){
  const box = document.getElementById('revByAccount');
  if (!box) return;
  const inc = includedEntries();
  const map = groupSum(inc, e=>e.account, e=>e.net);
  const rows = Array.from(map.entries()).sort((a,b)=>b[1]-a[1]);
  const total = sumBy(rows, r=>r[1]);
  box.innerHTML = `<table class="data">
    <thead><tr><th>Account</th><th class="num">Net revenue</th><th class="num">% of total</th></tr></thead>
    <tbody>
      ${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num ${v<0?'neg':'pos'}">${fmtMoney(v)}</td><td class="num">${fmtPct(total?v/total*100:0)}</td></tr>`).join('')}
      <tr class="total-row"><td>Total</td><td class="num">${fmtMoney(total)}</td><td class="num">100.0%</td></tr>
    </tbody></table>`;
}

function renderBreakdownTable(){
  const box = document.getElementById('breakdownTable');
  if (!box) return;
  const inc = includedEntries();
  const dim = DIM_FIELDS[state.breakdownDim].key;
  const map = new Map();
  for (const e of inc){
    const k = e[dim] || '(blank)';
    if (!map.has(k)) map.set(k, {net:0,count:0});
    const o = map.get(k); o.net += e.net; o.count += 1;
  }
  const rows = Array.from(map.entries()).sort((a,b)=>b[1].net-a[1].net);
  const total = sumBy(rows, r=>r[1].net);
  box.innerHTML = `<table class="data">
    <thead><tr><th>${esc(DIM_FIELDS[state.breakdownDim].label)}</th><th class="num">Lines</th><th class="num">Net</th><th class="num">% </th></tr></thead>
    <tbody>
      ${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${o.count}</td><td class="num ${o.net<0?'neg':'pos'}">${fmtMoney(o.net)}</td><td class="num">${fmtPct(total?o.net/total*100:0)}</td></tr>`).join('')}
      <tr class="total-row"><td>Total</td><td class="num">${sumBy(rows,r=>r[1].count)}</td><td class="num">${fmtMoney(total)}</td><td class="num">100.0%</td></tr>
    </tbody></table>`;
}

function renderRawDataTable(){
  const box = document.getElementById('rawDataTable');
  if (!box) return;
  const includedAccts = new Set(Object.values(state.accountMeta).filter(a=>a.included).map(a=>a.account));
  const rows = state.showAllAccounts ? state.entries : state.entries.filter(e=>includedAccts.has(e.account));

}

/* ---------------------------------------------------------------

function renderMappingPanel(){

  // a *preview* of the real parsed file, not a synthetic sample.
  const previewStart = Math.max(0, state.headerRowIdx-2);
  const previewEnd = Math.min(grid.length, state.headerRowIdx+1+300);
  const preview = grid.slice(previewStart, previewEnd);
  const colCount = Math.max(headerRow.length, ...preview.map(r=>(r||[]).length));

  const colOptions = (selected) => headerRow.map((c,i)=>
    `<option value="${i}" ${i===selected?'selected':''}>${i}: ${esc(String(c??'(blank)'))}</option>`
  ).join('');

  const fmtCell = (v) => {
    if (isDateLike(v)) return v.toISOString().slice(0,10);
    return String(v ?? '');
  };

  return `
    <div class="panel">
      <h2>Confirm how to read the file</h2>
      <div class="row">
        <div class="col field-group">
          <label class="field">Sheet</label>
          <select id="mapSheet">${sheets.map(s=>`<option value="${esc(s)}" ${s===state.sheetName?'selected':''}>${esc(s)}</option>`).join('')}</select>
        </div>
        <div class="col field-group">
          <label class="field">Header row (auto-detected)</label>
          <input type="number" id="mapHeaderRow" min="0" max="${grid.length-1}" value="${state.headerRowIdx}">
        </div>
      </div>
      <div class="row">
        <div class="col field-group">
          <label class="field">GL account column</label>
          <select id="mapAccount">${colOptions(state.colMap.account)}</select>
        </div>
        <div class="col field-group">
          <label class="field">Debit column</label>
          <select id="mapDebit">${colOptions(state.colMap.debit)}</select>
        </div>
        <div class="col field-group">
          <label class="field">Credit column</label>
          <select id="mapCredit">${colOptions(state.colMap.credit)}</select>
        </div>
        <div class="col field-group">
          <label class="field">Date column</label>
          <select id="mapDate">${colOptions(state.colMap.date)}</select>
        </div>
      </div>
      <p class="hint">Net revenue is calculated as <b>Credit − Debit</b> (correct for income accounts).</p>

      <div class="table-scroll" style="margin:12px 0;max-height:420px;">
        <table class="data preview-table">
          <thead>
            <tr>
              <th></th>
              ${Array.from({length:colCount}).map((_,ci)=>`<th>${esc(String(headerRow[ci] ?? ''))}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${preview.map((row,ri)=>{
              const realIdx = previewStart+ri;
              const isHeader = realIdx===state.headerRowIdx;
              return `<tr ${isHeader?'class="header-row"':''}>
                <td style="color:var(--ink-faint);">${realIdx}</td>
                ${Array.from({length:colCount}).map((_,ci)=>`<td>${esc(fmtCell((row||[])[ci]))}</td>`).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <p class="footnote" style="margin-top:0;">
        Showing rows ${previewStart}–${previewEnd-1} of ${grid.length.toLocaleString()} from your file
        (scroll to see more — both directions). The highlighted row is the header row used for mapping.
      </p>

      <div class="btn-row">
        <button class="btn" id="analyzeBtn">Analyze</button>
        <button class="btn secondary" data-act="load-new">Load a different file</button>
      </div>
    </div>
  `;
}

function wireMappingPanel(){
  const $ = id=>document.getElementById(id);
  $('mapSheet').addEventListener('change', e=>{
    state.sheetName = e.target.value;
    state.rawGrid = sheetToGrid(state.workbook, state.sheetName);
    state.headerRowIdx = detectHeaderRow(state.rawGrid);
    autoMapColumns();
    renderCurrentView();
  });
  $('mapHeaderRow').addEventListener('change', e=>{
    state.headerRowIdx = Math.max(0, Math.min(state.rawGrid.length-1, parseInt(e.target.value,10)||0));
    autoMapColumns();
    renderCurrentView();
  });
  $('mapAccount').addEventListener('change', e=> state.colMap.account = parseInt(e.target.value,10));
  $('mapDebit').addEventListener('change', e=> state.colMap.debit = parseInt(e.target.value,10));
  $('mapCredit').addEventListener('change', e=> state.colMap.credit = parseInt(e.target.value,10));
  $('mapDate').addEventListener('change', e=> state.colMap.date = parseInt(e.target.value,10));
  $('analyzeBtn').addEventListener('click', ()=>{
    state.colMap.account = parseInt($('mapAccount').value,10);
    state.colMap.debit = parseInt($('mapDebit').value,10);
    state.colMap.credit = parseInt($('mapCredit').value,10);
    state.colMap.date = parseInt($('mapDate').value,10);
    // re-detect dimension columns against the confirmed header row
    const headerRow = state.rawGrid[state.headerRowIdx] || [];
    const {dims} = detectColumns(headerRow);
    state.dimMap = dims;
    state.entries = resolveAccountTypes(buildEntries());
    state.monthLabel = deriveMonthLabel(state.entries);
    rebuildAccountMeta();
    renderCurrentView();
  });
  document.querySelectorAll('[data-act="load-new"]').forEach(b=>b.addEventListener('click', resetAll));
}

function autoMapColumns(){
  const headerRow = state.rawGrid[state.headerRowIdx] || [];
  const {map, dims} = detectColumns(headerRow);
  if (map.account===null){
    const fb = fallbackAccountColumn(state.rawGrid, state.headerRowIdx);
    if (fb>=0) map.account = fb;
  }
  state.colMap = map;
  state.dimMap = dims;
  state.headerNames = headerRow;
}

/* ---------------------------------------------------------------
   9. FILE LOAD HANDLERS + DROPZONE WIRING
   --------------------------------------------------------------- */
function wireDropzone(zoneId, inputId, onFiles){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  if (!zone) return;
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', e=>{ if (e.target.files.length) onFiles(e.target.files); });
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); zone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', e=>{
    if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
  });
}

async function onMainFileChosen(fileList){
  const file = fileList[0];
  try{
    const wb = await parseWorkbookFromFile(file);
    state.workbook = wb;
    state.sheetName = wb.SheetNames[0];
    state.rawGrid = sheetToGrid(wb, state.sheetName);
    state.headerRowIdx = detectHeaderRow(state.rawGrid);
    autoMapColumns();
    state.entries = [];
    renderCurrentView();
  }catch(err){
    alert('Could not read that file: ' + err.message);
  }
}

function resetAll(){
  state.workbook = null; state.sheetName=null; state.rawGrid=[];
  state.entries=[]; state.accountMeta={}; state.monthLabel=null;
  state.dateFrom=null; state.dateTo=null; state.filterValue='all'; state.searchTerm='';
  renderCurrentView();
}

/* ---------------------------------------------------------------
   10. CURRENT VIEW EVENT WIRING
   --------------------------------------------------------------- */
function wireCurrentViewEvents(){
  const view = document.getElementById('view-current');

  view.querySelectorAll('[data-act="toggle-acct"]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const acct = e.target.getAttribute('data-acct');
      state.accountMeta[acct].included = e.target.checked;
      renderAccountsList(); renderRevByCategory(); renderRevByAccount();
      renderBreakdownTable(); renderRawDataTable(); refreshKPIs();
    });
  });

  const byAct = (act, fn) => { const b=view.querySelector(`[data-act="${act}"]`); if (b) b.addEventListener('click', fn); };
  byAct('acct-select-all', ()=>{ Object.values(state.accountMeta).forEach(a=>a.included=true); fullRefresh(); });
  byAct('acct-clear', ()=>{ Object.values(state.accountMeta).forEach(a=>a.included=false); fullRefresh(); });
  byAct('acct-only-rev', ()=>{ Object.values(state.accountMeta).forEach(a=>a.included=(a.bucket==='revenue')); fullRefresh(); });
  byAct('load-new', resetAll);
  byAct('clear-current', ()=>{ if(confirm('Clear the currently loaded file? Saved history is kept.')) resetAll(); });

  byAct('save-history', ()=>{
    const label = state.monthLabel || prompt('Month label for this data (e.g. "Jun 2026"):');
    if (!label) return;
    saveMonthsToHistory([label]);
    alert(`Saved "${label}" to history.`);
    fullRefresh();
  });
  byAct('export-history', ()=>{
    downloadFile('history.json', JSON.stringify(state.history, null, 2), 'application/json');
  });
  const importInput = document.getElementById('importHistoryInput');
  if (importInput) importInput.addEventListener('change', async e=>{
    const f = e.target.files[0]; if (!f) return;
    try{
      const text = await f.text();
      const data = JSON.parse(text);
      state.history = {...state.history, ...data};
      saveHistory();
      alert('History imported.');
      fullRefresh();
    }catch(err){ alert('Could not read history.json: '+err.message); }
  });

  const $ = id=>document.getElementById(id);
  if ($('filterFrom')) $('filterFrom').addEventListener('change', e=>{ state.dateFrom = e.target.value||null; refreshBreakdowns(); });
  if ($('filterTo')) $('filterTo').addEventListener('change', e=>{ state.dateTo = e.target.value||null; refreshBreakdowns(); });
  if ($('breakdownDim')) $('breakdownDim').addEventListener('change', e=>{ state.breakdownDim = e.target.value; state.filterValue='all'; renderCurrentView(); });
  if ($('filterValue')) $('filterValue').addEventListener('change', e=>{ state.filterValue = e.target.value; refreshBreakdowns(); });
  if ($('showAllAccounts')) $('showAllAccounts').addEventListener('change', e=>{ state.showAllAccounts = e.target.checked; renderRawDataTable(); });

  if ($('acctSearch')) $('acctSearch').addEventListener('input', e=>{ state.searchTerm = e.target.value; renderAccountsList(); });
  byAct('acct-collapse', ()=>{ state.acctListCollapsed = !state.acctListCollapsed; renderCurrentView(); });

  if ($('rowSearch')) $('rowSearch').addEventListener('input', e=>{ state.rowSearch = e.target.value; refreshBreakdowns(); });
  byAct('clear-row-search', ()=>{ state.rowSearch=''; if($('rowSearch')) $('rowSearch').value=''; refreshBreakdowns(); });
  byAct('view-details-link', (e)=>{
    e.preventDefault();
    document.getElementById('rawDataTable').scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function refreshBreakdowns(){
  renderRevByCategory(); renderRevByAccount(); renderBreakdownTable(); renderRawDataTable(); refreshKPIs();
}
function refreshKPIs(){
  const inc = includedEntries();
  const revEl = document.getElementById('kpiRevenueValue');
  const txnEl = document.getElementById('kpiTxnValue');
  if (revEl) revEl.textContent = fmtMoney(sumBy(inc, e=>e.net));
  if (txnEl) txnEl.textContent = inc.length.toLocaleString();
}
function fullRefresh(){ renderCurrentView(); }

function renderMoMVariance(){
  const box = document.getElementById('momVariance');
  if (!box) return;
  const a = state.history[state.momCompareA], b = state.history[state.momCompareB];
  if (!a || !b){ box.innerHTML=''; return; }
  const key = 'by' + state.momBreakdownDim[0].toUpperCase() + state.momBreakdownDim.slice(1);
  const mapKey = {department:'byDepartment',productLine:'byProductLine',customer:'byCustomer',
                  division:'byDivision',subsidiary:'bySubsidiary',accountType:'byDepartment'}[state.momBreakdownDim] || 'byDepartment';
  const av = a[mapKey]||{}, bv = b[mapKey]||{};
  const keys = uniqSorted([...Object.keys(av), ...Object.keys(bv)]);
  const rows = keys.map(k=>({k, a:av[k]||0, b:bv[k]||0, d:(bv[k]||0)-(av[k]||0)}))
    .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  box.innerHTML = `<table class="data">
    <thead><tr><th>${esc(DIM_FIELDS[state.momBreakdownDim].label)}</th>
      <th class="num">${esc(state.momCompareA)}</th><th class="num">${esc(state.momCompareB)}</th><th class="num">Δ</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td class="num">${fmtMoney(r.a)}</td>
      <td class="num">${fmtMoney(r.b)}</td><td class="num ${r.d<0?'neg':'pos'}">${fmtMoney(r.d)}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderMoMCustomer(){
  const box = document.getElementById('momCustomer');
  if (!box) return;
  const months = sortedMonthLabels(Object.keys(state.history));
  const custSet = new Set();
  months.forEach(m=>Object.keys(state.history[m].byCustomer||{}).forEach(c=>custSet.add(c)));
  const custs = Array.from(custSet);
  const totals = custs.map(c=>({c, total: sumBy(months,m=>(state.history[m].byCustomer||{})[c]||0)}))
    .sort((a,b)=>b.total-a.total).slice(0,25);
  box.innerHTML = `<table class="data">
    <thead><tr><th>Customer</th>${months.map(m=>`<th class="num">${esc(m)}</th>`).join('')}</tr></thead>
    <tbody>${totals.map(({c})=>`<tr><td>${esc(c)}</td>${months.map(m=>{
      const v=(state.history[m].byCustomer||{})[c]||0;
      return `<td class="num">${v?fmtMoney(v):'—'}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
}

function wireMoMEvents(){
  const view = document.getElementById('view-mom');
  wireHistoryImport('importHistoryInputMoM', renderMoMView);
  const byAct=(act,fn)=>{const b=view.querySelector(`[data-act="${act}"]`); if(b) b.addEventListener('click',fn);};
  byAct('export-history-mom', ()=>downloadFile('history.json', JSON.stringify(state.history,null,2),'application/json'));
  byAct('clear-history', ()=>{ if(confirm('Clear all saved history? This cannot be undone.')){ state.history={}; saveHistory(); renderMoMView(); }});
  const $=id=>document.getElementById(id);
  if ($('momA')) $('momA').addEventListener('change', e=>{ state.momCompareA=e.target.value; renderMoMVariance(); });
  if ($('momB')) $('momB').addEventListener('change', e=>{ state.momCompareB=e.target.value; renderMoMVariance(); });
  if ($('momDim')) $('momDim').addEventListener('change', e=>{ state.momBreakdownDim=e.target.value; renderMoMVariance(); });
}

/* ---------------------------------------------------------------
   12. RENDER: REVENUE TYPES (Recurring vs Non-Recurring)
   --------------------------------------------------------------- */
function renderRevTypesView(){
  const el = document.getElementById('view-revtypes');
  const months = sortedMonthLabels(Object.keys(state.history));
  if (!months.length){
    el.innerHTML = `
      <div class="panel empty-state">
        <div class="glyph">🧩</div>
        <h3>No saved months yet</h3>
        <p>Load months on the <b>Month over Month</b> tab (or save from Current Month) first —
           then this tab breaks that revenue down by type.</p>
      </div>`;
    return;
  }
  if (!state.revFocusMonth || !months.includes(state.revFocusMonth)) state.revFocusMonth = months[months.length-1];
  const dim = state.revCompDim;

  el.innerHTML = `
    <div class="panel">
      <h2>Recurring vs Non-Recurring by month <span class="muted">— click to expand</span></h2>
      <div id="revTypeStack"></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <h2>Composition <span class="muted">— ${esc(state.revFocusMonth)}</span></h2>
        <div class="field-group" style="max-width:220px;">
          <label class="field">Focus month</label>
          <select id="revFocusMonth">${months.map(m=>`<option ${m===state.revFocusMonth?'selected':''}>${esc(m)}</option>`).join('')}</select>
        </div>
        <div id="revComposition"></div>
      </div>
      <div class="panel">
        <h2>Recurring vs Non-Recurring (all saved months)</h2>
        <div class="table-scroll" id="revAllMonths" style="max-height:280px;"></div>
      </div>
    </div>
    <div class="panel">
      <div class="row" style="align-items:center;justify-content:space-between;">
        <h2 style="margin:0;">Composition detail</h2>
        <div class="field-group" style="min-width:200px;margin:0;">
          <select id="revCompDim">
            ${Object.entries(DIM_FIELDS).filter(([k])=>['productLine','department','customer','division'].includes(k)).map(([k,v])=>
              `<option value="${k}" ${k===dim?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="table-scroll" id="revCompDetail" style="max-height:320px;"></div>
    </div>
    <div class="panel">
      <h2>Composition over time</h2>
      <div id="revCompOverTime"></div>
    </div>
  `;

  const stack = document.getElementById('revTypeStack');
  const totals = months.map(m=>{
    const bt = state.history[m].byRevenueType||{};
    const rec = bt['Recurring']||0, non = bt['Non-Recurring']||0, unc = bt['Unclassified']||0;
    return {m, rec, non, unc, total: rec+non+unc};
  });
  const maxTotal = Math.max(...totals.map(t=>Math.abs(t.total)), 1);
  stack.innerHTML = totals.map(t=>`
    <div class="bar-row" data-act="rev-focus" data-month="${esc(t.m)}" style="cursor:pointer;">
      <div class="label">${esc(t.m)}</div>
      <div class="bar-track" style="display:flex;">
        <div style="width:${Math.abs(t.rec)/maxTotal*100}%;background:var(--accent);height:100%;" title="Recurring ${fmtMoney(t.rec)}"></div>
        <div style="width:${Math.abs(t.non)/maxTotal*100}%;background:var(--amber);height:100%;" title="Non-Recurring ${fmtMoney(t.non)}"></div>
        <div style="width:${Math.abs(t.unc)/maxTotal*100}%;background:var(--ink-faint);height:100%;" title="Unclassified ${fmtMoney(t.unc)}"></div>
      </div>
      <div class="val pos">${fmtMoneyShort(t.total)}</div>
    </div>`).join('') + `
    <div class="footnote">
      <span class="chip" style="background:var(--accent);color:#fff;border-color:var(--accent);">Recurring</span>
      <span class="chip" style="background:var(--amber);color:#fff;border-color:var(--amber);">Non-Recurring</span>
      <span class="chip" style="background:var(--ink-faint);color:#fff;border-color:var(--ink-faint);">Unclassified</span>
      &nbsp;Classified from account name (Recurring / Non Recurring) with Product Line as a fallback signal.
    </div>`;

  renderRevComposition();
  renderRevAllMonths();
  renderRevCompDetail();
  renderRevCompOverTime();
  wireRevTypesEvents();
}

function renderRevComposition(){
  const box = document.getElementById('revComposition');
  const snap = state.history[state.revFocusMonth];
  if (!box || !snap) return;
  const bt = snap.byRevenueType || {};
  const total = sumBy(Object.values(bt), v=>v) || 1;
  const rows = Object.entries(bt).sort((a,b)=>b[1]-a[1]);
  box.innerHTML = rows.map(([k,v])=>`
    <div class="bar-row">
      <div class="label">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.abs(v)/total*100}%;background:${k==='Recurring'?'var(--accent)':k==='Non-Recurring'?'var(--amber)':'var(--ink-faint)'}"></div></div>
      <div class="val pos">${fmtMoneyShort(v)} · ${fmtPct(v/total*100)}</div>
    </div>`).join('');
}

function renderRevAllMonths(){
  const box = document.getElementById('revAllMonths');
  if (!box) return;
  const months = sortedMonthLabels(Object.keys(state.history));
  box.innerHTML = `<table class="data">
    <thead><tr><th>Month</th><th class="num">Recurring</th><th class="num">Non-Recurring</th><th class="num">Unclassified</th><th class="num">% Recurring</th></tr></thead>
    <tbody>${months.map(m=>{
      const bt = state.history[m].byRevenueType||{};
      const rec=bt['Recurring']||0, non=bt['Non-Recurring']||0, unc=bt['Unclassified']||0;
      const total = rec+non+unc || 1;
      return `<tr><td>${esc(m)}</td><td class="num">${fmtMoney(rec)}</td><td class="num">${fmtMoney(non)}</td>
        <td class="num">${fmtMoney(unc)}</td><td class="num">${fmtPct(rec/total*100)}</td></tr>`;
    }).join('')}</tbody></table>`;
}

function renderRevCompDetail(){
  const box = document.getElementById('revCompDetail');
  const snap = state.history[state.revFocusMonth];
  if (!box || !snap) return;
  const mapKey = {productLine:'byProductLine',department:'byDepartment',customer:'byCustomer',division:'byDivision'}[state.revCompDim];
  const data = snap[mapKey] || {};
  const rows = Object.entries(data).sort((a,b)=>b[1]-a[1]);
  const total = sumBy(rows, r=>r[1]) || 1;
  box.innerHTML = `<table class="data">
    <thead><tr><th>${esc(DIM_FIELDS[state.revCompDim].label)}</th><th class="num">Revenue</th><th class="num">%</th></tr></thead>
    <tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fmtMoney(v)}</td><td class="num">${fmtPct(v/total*100)}</td></tr>`).join('')}
      <tr class="total-row"><td>Total</td><td class="num">${fmtMoney(total)}</td><td class="num">100.0%</td></tr>
    </tbody></table>`;
}

function renderRevCompOverTime(){
  const box = document.getElementById('revCompOverTime');
  if (!box) return;
  const months = sortedMonthLabels(Object.keys(state.history));
  const mapKey = {productLine:'byProductLine',department:'byDepartment',customer:'byCustomer',division:'byDivision'}[state.revCompDim];
  const allKeys = new Set();
  months.forEach(m=>Object.keys(state.history[m][mapKey]||{}).forEach(k=>allKeys.add(k)));
  const keys = Array.from(allKeys).sort((a,b)=>
    sumBy(months,m=>(state.history[m][mapKey]||{})[b]||0) - sumBy(months,m=>(state.history[m][mapKey]||{})[a]||0)
  ).slice(0,10);
  box.innerHTML = `<div class="table-scroll" style="max-height:260px;"><table class="data">
    <thead><tr><th>${esc(DIM_FIELDS[state.revCompDim].label)}</th>${months.map(m=>`<th class="num">${esc(m)}</th>`).join('')}</tr></thead>
    <tbody>${keys.map(k=>`<tr><td>${esc(k)}</td>${months.map(m=>{
      const v=(state.history[m][mapKey]||{})[k]||0;
      return `<td class="num">${v?fmtMoney(v):'—'}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function wireRevTypesEvents(){
  const view = document.getElementById('view-revtypes');
  view.querySelectorAll('[data-act="rev-focus"]').forEach(row=>{
    row.addEventListener('click', ()=>{
      state.revFocusMonth = row.getAttribute('data-month');
      renderRevTypesView();
    });
  });
  const $=id=>document.getElementById(id);
  if ($('revFocusMonth')) $('revFocusMonth').addEventListener('change', e=>{ state.revFocusMonth=e.target.value; renderRevComposition(); renderRevCompDetail(); });
  if ($('revCompDim')) $('revCompDim').addEventListener('change', e=>{ state.revCompDim=e.target.value; renderRevCompDetail(); renderRevCompOverTime(); });
}

/* ---------------------------------------------------------------
   13. RENDER: P&L (Standard / VBS-Classic / COGS / Staff / Non-Staff)
   --------------------------------------------------------------- */
function pnlAvailableMonths(){
  const months = new Set(Object.keys(state.history));
  if (state.monthLabel) months.add(state.monthLabel);
  return sortedMonthLabels(Array.from(months));
}
function currentPnlSnapshot(month){
  if (state.history[month]) return state.history[month];
  if (month === state.monthLabel && state.entries.length){
    // build an ad-hoc (unsaved) snapshot from the currently loaded file
    return buildSnapshotForMonth(month, includedEntries());
  }
  return null;
}

function renderPnLView(){
  const el = document.getElementById('view-pnl');
  const months = pnlAvailableMonths();
  if (!months.length){
    el.innerHTML = `
      <div class="panel empty-state">
        <div class="glyph">📑</div>
        <h3>No data loaded yet</h3>
        <p>Load a GL export on the <b>Current Month</b> tab. It classifies every line into
           Revenue / COGS / Staff / Non-Staff automatically from account numbers and account types.</p>
      </div>`;
    return;
  }
  if (!state.pnlLocked || !months.includes(state.pnlMonths[state.pnlMonthIdx])){
    state.pnlMonths = months;
    state.pnlMonthIdx = months.length-1;
  }
  const month = state.pnlMonths[state.pnlMonthIdx];
  const snap = currentPnlSnapshot(month);

  el.innerHTML = `
    <div class="panel">
      <div class="row" style="align-items:center;justify-content:space-between;">
        <div class="month-flip">
          <button class="arrow" data-act="pnl-prev">‹</button>
          <span class="cur">${esc(month)}</span>
          <button class="arrow" data-act="pnl-next">›</button>
          <button class="lock-btn ${state.pnlLocked?'locked':''}" data-act="pnl-lock">${state.pnlLocked?'🔒 Locked':'🔓 Lock month'}</button>
        </div>
        <div class="btn-row">
          <button class="btn secondary" data-act="pnl-clear-all">Clear all months</button>
        </div>
      </div>
      <div class="badge-toggle" style="margin-top:12px;">
        <button data-pnl-sub="standard" class="${state.pnlSub==='standard'?'active':''}">Standard P&amp;L</button>
        <button data-pnl-sub="vbs" class="${state.pnlSub==='vbs'?'active':''}">VBS / Classic</button>
        <button data-pnl-sub="cogs" class="${state.pnlSub==='cogs'?'active':''}">COGS</button>
        <button data-pnl-sub="staff" class="${state.pnlSub==='staff'?'active':''}">Staff Costs</button>
        <button data-pnl-sub="nonstaff" class="${state.pnlSub==='nonstaff'?'active':''}">Non Staff Costs</button>
      </div>
    </div>
    <div class="panel" id="pnlBody"></div>
  `;
  renderPnLBody(snap, month);
  wirePnLEvents();
}

function renderPnLBody(snap, month){
  const box = document.getElementById('pnlBody');
  if (!snap){
    box.innerHTML = `<div class="footnote">No snapshot available for ${esc(month)}. Save it to history from the Current Month tab, or load its GL export.</div>`;
    return;
  }
  const p = snap.pnl;
  const gross = p.revenue + p.cogs;
  const opInc = gross + p.staff + p.nonstaff;

  if (state.pnlSub === 'standard'){
    box.innerHTML = `
      <h2>Standard P&amp;L — ${esc(month)}</h2>
      <div class="pnl-line" data-act="pnl-drill" data-bucket="revenue"><span class="l">Revenue</span><span class="v pos">${fmtMoney(p.revenue)}</span></div>
      <div class="pnl-line" data-act="pnl-drill" data-bucket="cogs"><span class="l">COGS</span><span class="v ${p.cogs<0?'neg':'pos'}">${fmtMoney(p.cogs)}</span></div>
      <div class="pnl-line section"><span class="l">Gross Profit</span><span class="v ${gross<0?'neg':'pos'}">${fmtMoney(gross)}</span></div>
      <div class="pnl-line" data-act="pnl-drill" data-bucket="staff"><span class="l">Staff Costs</span><span class="v ${p.staff<0?'neg':'pos'}">${fmtMoney(p.staff)}</span></div>
      <div class="pnl-line" data-act="pnl-drill" data-bucket="nonstaff"><span class="l">Non-Staff Costs</span><span class="v ${p.nonstaff<0?'neg':'pos'}">${fmtMoney(p.nonstaff)}</span></div>
      <div class="pnl-line grand"><span class="l">Operating Income</span><span class="v ${opInc<0?'neg':'pos'}">${fmtMoney(opInc)}</span></div>
      <p class="footnote">Gross margin ${fmtPct(p.revenue?gross/p.revenue*100:0)} · Operating margin ${fmtPct(p.revenue?opInc/p.revenue*100:0)}</p>
    `;
  } else if (state.pnlSub === 'vbs'){
    const byDiv = snap.byDivision || {};
    const divs = Object.entries(byDiv).sort((a,b)=>b[1]-a[1]);
    box.innerHTML = `
      <h2>VBS / Classic — ${esc(month)}</h2>
      <p class="footnote" style="margin-top:-6px;">Placeholder grouping by <b>Division</b> until the real VBS chart-of-accounts mapping is wired in — swap <code>renderPnLBody()</code>'s VBS branch for your actual mapping table.</p>
      ${divs.map(([k,v])=>`<div class="pnl-line"><span class="l">${esc(k)}</span><span class="v ${v<0?'neg':'pos'}">${fmtMoney(v)}</span></div>`).join('')}
      <div class="pnl-line grand"><span class="l">Total</span><span class="v pos">${fmtMoney(sumBy(divs,d=>d[1]))}</span></div>
    `;
  } else {
    const bucketMap = {cogs:['COGS', p.cogs, p.byDeptCogs], staff:['Staff Costs', p.staff, p.byDeptStaff], nonstaff:['Non-Staff Costs', p.nonstaff, p.byDeptNonStaff]};
    const [label, total, byDept] = bucketMap[state.pnlSub];
    const rows = Object.entries(byDept||{}).sort((a,b)=>a[1]-b[1]);
    box.innerHTML = `
      <h2>${esc(label)} by Department — ${esc(month)}</h2>
      ${rows.map(([k,v])=>`<div class="pnl-line" data-act="pnl-drill" data-bucket="${state.pnlSub}" data-dept="${esc(k)}">
        <span class="l">${esc(k)}</span><span class="v ${v<0?'neg':'pos'}">${fmtMoney(v)}</span></div>`).join('')}
      <div class="pnl-line grand"><span class="l">Total ${esc(label)}</span><span class="v ${total<0?'neg':'pos'}">${fmtMoney(total)}</span></div>
      <p class="footnote">Click a line to see the underlying GL entries (available for months where the source file is currently loaded).</p>
    `;
  }
}

function wirePnLEvents(){
  const view = document.getElementById('view-pnl');
  const byAct=(act,fn)=>{ view.querySelectorAll(`[data-act="${act}"]`).forEach(b=>b.addEventListener('click',fn)); };
  byAct('pnl-prev', ()=>{ state.pnlMonthIdx = Math.max(0, state.pnlMonthIdx-1); renderPnLView(); });
  byAct('pnl-next', ()=>{ state.pnlMonthIdx = Math.min(state.pnlMonths.length-1, state.pnlMonthIdx+1); renderPnLView(); });
  byAct('pnl-lock', ()=>{ state.pnlLocked = !state.pnlLocked; renderPnLView(); });
  byAct('pnl-clear-all', ()=>{ if(confirm('Clear all saved history months? This cannot be undone.')){ state.history={}; saveHistory(); renderPnLView(); }});
  view.querySelectorAll('[data-pnl-sub]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.pnlSub = b.getAttribute('data-pnl-sub'); renderPnLView(); });
  });
  view.querySelectorAll('[data-act="pnl-drill"]').forEach(line=>{
    line.addEventListener('click', ()=>{
      const bucket = line.getAttribute('data-bucket');
      const dept = line.getAttribute('data-dept');
      openPnLDrawer(bucket, dept);
    });
  });
}

function openPnLDrawer(bucket, dept){
  const month = state.pnlMonths[state.pnlMonthIdx];
  const bucketLabels = {revenue:'Revenue', cogs:'COGS', staff:'Staff Costs', nonstaff:'Non-Staff Costs'};
  let rows = [];
  if (month === state.monthLabel && state.entries.length){
    rows = state.entries.filter(e=>{
      const l = e.period || (e.date?monthLabelFromDate(e.date):null);
      if (l !== month) return false;
      if (classifyBucket(e) !== bucket) return false;
      if (dept && e.department !== dept) return false;
      return true;
    });
  }
  const title = `${bucketLabels[bucket]}${dept?' · '+dept:''} — ${month}`;
  openDrawer(title, rows);
}

function openDrawer(title, rows){
  document.getElementById('drawerTitle').textContent = title;
  const body = document.getElementById('drawerBody');
  if (!rows.length){
    body.innerHTML = `<div class="footnote">No line-level detail cached for this month — it's only available while that month's GL export is loaded on the Current Month tab (saved history keeps totals only, to stay lightweight).</div>`;
  } else {
    const total = sumBy(rows, r=>r.net);
    body.innerHTML = `<table class="data">
      <thead><tr><th>Account</th><th>Date</th><th>Department</th><th class="num">Net</th></tr></thead>
      <tbody>${rows.map(e=>`<tr><td>${esc(e.account)}</td><td>${e.date?e.date.toISOString().slice(0,10):''}</td>
        <td>${esc(e.department)}</td><td class="num ${e.net<0?'neg':'pos'}">${fmtMoney(e.net)}</td></tr>`).join('')}
        <tr class="total-row"><td colspan="3">Total</td><td class="num">${fmtMoney(total)}</td></tr>
      </tbody></table>`;
  }
  window.__drawerRows = rows;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

/* ---------------------------------------------------------------
   14. TAB NAVIGATION + APP INIT
   --------------------------------------------------------------- */
const VIEW_RENDERERS = {
  current: renderCurrentView,
  mom: renderMoMView,
  revtypes: renderRevTypesView,
  pnl: renderPnLView,
};

function switchView(name, opts={}){
  document.querySelectorAll('#tabNav > button[data-view], #pnlTabBtn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-view')===name);
  });
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));
  if (!opts.keepMenu) document.getElementById('pnlMenu').classList.remove('open');
  (VIEW_RENDERERS[name]||function(){})();
  renderLastLoadedBar();
}

function renderLastLoadedBar(){
  const bar = document.getElementById('lastLoadedBar');
  if (!bar) return;
  if (!state.workbook && !Object.keys(state.history).length){ bar.innerHTML=''; return; }
  const parts = [];
  if (state.monthLabel) parts.push(`Last loaded: <b>${esc(state.monthLabel)}</b>`);
  const savedAt = state.monthLabel && state.history[state.monthLabel] ? state.history[state.monthLabel].savedAt : null;
  if (savedAt){
    const d = new Date(savedAt);
    parts.push(`saved ${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}, ${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`);
  }
  bar.innerHTML = parts.length ? parts.join(' · ') : '';
}

function initNav(){
  document.querySelectorAll('#tabNav > button[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.getAttribute('data-view')));
  });
  document.getElementById('pnlTabBtn').addEventListener('click', (e)=>{
    const menu = document.getElementById('pnlMenu');
    const wasOpen = menu.classList.contains('open');
    e.stopPropagation();
    switchView('pnl', {keepMenu:true});
    menu.classList.toggle('open', !wasOpen);
  });
  document.querySelectorAll('#pnlMenu [data-pnl]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.pnlSub = btn.getAttribute('data-pnl');
      document.querySelectorAll('#pnlMenu [data-pnl]').forEach(b=>b.classList.toggle('active', b===btn));
      switchView('pnl');
    });
  });
  document.addEventListener('click', (e)=>{
    if (!e.target.closest('.pnl-wrap')) document.getElementById('pnlMenu').classList.remove('open');
  });
  document.getElementById('headerLoadNew').addEventListener('click', resetAll);
  document.getElementById('headerClearSaved').addEventListener('click', ()=>{
    if (!Object.keys(state.history).length){ alert('No saved history yet.'); return; }
    if (confirm('Clear all saved history (Month-over-Month data)? This cannot be undone.')){
      state.history = {}; saveHistory();
      renderLastLoadedBar();
      const active = document.querySelector('#tabNav > button.active, #pnlTabBtn.active');
      (VIEW_RENDERERS[active ? active.getAttribute('data-view') : 'current'])();
    }
  });
}

function initDrawer(){
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
  document.getElementById('drawerExport').addEventListener('click', ()=>{
    const rows = window.__drawerRows || [];
    if (!rows.length){ alert('Nothing to export for this line.'); return; }
    const csv = rowsToCSV(
      ['Account','Date','Department','Product Line','Customer','Debit','Credit','Net'],
      rows.map(e=>[e.account, e.date?e.date.toISOString().slice(0,10):'', e.department, e.productLine, e.customer, e.debit, e.credit, e.net])
    );
    downloadFile('gl-detail.csv', csv);
  });
}

function init(){
  initNav();
  initDrawer();
  renderCurrentView();
}
document.addEventListener('DOMContentLoaded', init);
</script>
